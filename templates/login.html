<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Bot — Sign in</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0f1117">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <style>
    :root { --bg:#0f1117; --surface:#1a1d27; --border:#2e3347; --text:#e2e8f0; --muted:#8892a4; --blue:#60a5fa; --red:#f87171; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f0f2f8; --surface:#ffffff; --border:#dde1ec; --text:#111827; --muted:#6b7280; --blue:#2563eb; --red:#dc2626; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    form { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px;
           width: 100%; max-width: 340px; display: grid; gap: 14px; }
    img { width: 56px; height: 56px; justify-self: center; }
    h1 { font-size: 18px; text-align: center; }
    input { width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font-size: 16px; }
    button { padding: 11px; border: 0; border-radius: 8px; background: var(--blue); color: #fff;
             font-size: 15px; font-weight: 600; cursor: pointer; }
    .err { color: var(--red); font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <form method="post">
    <img src="/static/icons/icon-192.png" alt="">
    <h1>Trading Bot</h1>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
