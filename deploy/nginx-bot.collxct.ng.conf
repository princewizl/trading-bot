# bot.collxct.ng → trading-bot-web:8000
# Goes into the main Collxct nginx (collxct-nginx-1), next to the recbot.collxct.ng block.
# Certificate: its own Let's Encrypt cert, issued the same way as Recbot's (see DEPLOY.md).

server {
    listen 80;
    server_name bot.collxct.ng;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bot.collxct.ng;

    ssl_certificate     /etc/letsencrypt/live/bot.collxct.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.collxct.ng/privkey.pem;

    # Resolve the container at request time via Docker's DNS. With a literal
    # upstream, nginx refuses to start/reload while trading-bot-web is down —
    # which would take Collxct and Recbot down with it.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $bot_web http://trading-bot-web:8000;

    client_max_body_size 1m;

    location / {
        proxy_pass $bot_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
